<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>慈善助学项目 · 湖北省育才教育基金会</title>
  <style>
    :root {
      --sage: #A9BF7D;
      --sage-dark: #8DA361;
      --sage-soft: #E3EBD1;
      --ink: #2A3654;
      --bg: #E6E7DE;
      --surface: #FFFFFF;
      --muted: #6B7280;
      --radius: 20px;
      --maxw: 820px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.9; padding: 48px 20px 80px;
    }
    .wrap { max-width: var(--maxw); margin: 0 auto; }
    .back {
      display: inline-flex; align-items: center; gap: 6px; color: var(--sage-dark);
      text-decoration: none; font-weight: 600; margin-bottom: 28px; font-size: 15px;
    }
    .back:hover { color: var(--ink); }
    .tag {
      display: inline-block; background: var(--sage-soft); color: var(--sage-dark);
      padding: 4px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; margin-bottom: 16px;
    }
    h1 { font-family: 'Outfit', 'Montserrat', 'Noto Sans SC', sans-serif; font-size: 32px; line-height: 1.4; margin-bottom: 10px; }
    .meta { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
    .cover {
      width: 100%; aspect-ratio: 16 / 9; border-radius: var(--radius); overflow: hidden;
      background: linear-gradient(135deg, var(--sage), var(--sage-dark)); margin-bottom: 36px;
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px;
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; }
    p { font-size: 17px; color: #3a4050; margin-bottom: 20px; }
    h2 { font-size: 20px; margin: 36px 0 14px; color: var(--ink); }
    ul { padding-left: 22px; margin-bottom: 20px; }
    li { font-size: 16px; color: #3a4050; margin-bottom: 8px; }
    .charity-text { font-size: 17px; color: #3a4050; margin-bottom: 20px; line-height: 1.9; }
    .charity-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .charity-img { width: 100%; border-radius: var(--radius); object-fit: cover; display: block; }
    .charity-doc { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; background: var(--sage-soft); color: var(--sage-dark); border-radius: 999px; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
    .charity-hint { color: var(--muted); font-size: 15px; margin-top: 12px; }
    .footer { margin-top: 48px; text-align: center; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html#experience">← 返回作品集</a>
    <span class="tag">公益 · 慈善助学</span>
    <h1>湖北省育才教育基金会 · 慈善助学项目</h1>
    <div class="meta">志愿者 ｜ 湖北，中国 ｜ 2025 – 至今</div>

    <div id="charity-content"><p style="color:var(--muted)">加载中…</p></div>

    <script>
      (function () {
        const box = document.getElementById("charity-content");
        function render(blocks) {
          if (!Array.isArray(blocks) || !blocks.length) {
            box.innerHTML = "<p class=\"charity-text\">暂无内容。</p>";
            return;
          }
          box.innerHTML = "";
          let gallery = null;
          blocks.forEach(function (b) {
            if (b.type === "text" || b.type === "heading") {
              if (gallery) { box.appendChild(gallery); gallery = null; }
              const el = document.createElement(b.type === "heading" ? "h2" : "p");
              el.className = b.type === "heading" ? "" : "charity-text";
              el.textContent = (b.type === "text" ? (b.html || b.content || b.text || "") : (b.text || b.content || ""));
              box.appendChild(el);
            } else if (b.type === "image") {
              if (!gallery) {
                gallery = document.createElement("div");
                gallery.className = "charity-gallery";
              }
              const img = document.createElement("img");
              img.className = "charity-img";
              img.src = b.src || "";
              img.alt = b.alt || "项目图片";
              img.onerror = function () { this.style.display = "none"; };
              gallery.appendChild(img);
            } else if (b.type === "pdf") {
              if (gallery) { box.appendChild(gallery); gallery = null; }
              const a = document.createElement("a");
              a.className = "charity-doc";
              a.href = b.src || "#";
              a.target = "_blank";
              a.rel = "noopener";
              a.textContent = "📎 " + (b.label || "PDF 文档");
              box.appendChild(a);
            }
          });
          if (gallery) box.appendChild(gallery);
        }
        fetch("content.json?t=" + Date.now(), { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            const exp = (data.experience || []).find(function (e) { return e.id === "exp-yucai"; });
            render(exp && exp.blocks ? exp.blocks : []);
          })
          .catch(function (err) {
            box.innerHTML = '<p class="charity-text" style="color:var(--muted)">内容加载失败，请刷新重试。</p>';
          });
      })();
    </script>

    <div class="footer">© 2026 李欣怡 · 内容策划 / 短视频编导作品集</div>
  </div>
</body>
</html>
